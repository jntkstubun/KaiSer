<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KaiSer — Kasir Simpel, Bisnis Lancar</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="css/creator.css">
  <style>
    .portal-container {
      min-height: 100vh;
      background: linear-gradient(135deg, #0f172a 0%, #0284c7 100%);
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      padding: 24px;
      color: white;
      text-align: center;
    }
    .portal-header {
      margin-bottom: 40px;
    }
    .portal-logo {
      font-size: 54px;
      margin-bottom: 12px;
      animation: pulse-wave 2s infinite ease-in-out;
    }
    .portal-title {
      font-size: 36px;
      font-weight: 800;
      letter-spacing: -1px;
    }
    .portal-subtitle {
      font-size: 16px;
      color: #94a3b8;
      margin-top: 6px;
    }
    .portal-grid {
      display: grid;
      grid-template-columns: repeat(auto-fit, minmax(280px, 1fr));
      gap: 24px;
      width: 100%;
      max-width: 680px;
    }
    .portal-card {
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(12px);
      padding: 32px 24px;
      border-radius: var(--radius-lg);
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.3);
      color: var(--text-main);
      text-decoration: none;
      transition: transform 0.2s ease, box-shadow 0.2s ease;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    .portal-card:hover {
      transform: translateY(-6px);
      box-shadow: 0 25px 50px rgba(0, 0, 0, 0.4);
    }
    .portal-icon {
      font-size: 44px;
      margin-bottom: 16px;
    }
    .portal-card-title {
      font-size: 20px;
      font-weight: 800;
      color: var(--dark-ocean);
      margin-bottom: 8px;
    }
    .portal-card-desc {
      font-size: 13px;
      color: var(--text-muted);
      margin-bottom: 20px;
      line-height: 1.4;
    }
  </style>
</head>
<body>

  <div class="portal-container">
    <div class="portal-header">
      <div class="portal-logo">🌊</div>
      <h1 class="portal-title">KaiSer</h1>
      <p class="portal-subtitle">Kasir Simpel, Bisnis Lancar</p>
    </div>

    <div class="portal-grid">
      
      <!-- Creator Card -->
      <a href="creator.html" class="portal-card">
        <div class="portal-icon">👑</div>
        <div class="portal-card-title">KaiSer Creator</div>
        <p class="portal-card-desc">Panel Pengelola & Pembuat Akun Warung (Khusus Admin / Creator)</p>
        <button class="btn-primary" style="pointer-events: none;">Buka Panel Creator ➔</button>
      </a>

      <!-- Warung Card -->
      <a href="warung.html" class="portal-card">
        <div class="portal-icon">🏪</div>
        <div class="portal-card-title">KaiSer Warung</div>
        <p class="portal-card-desc">Aplikasi Kasir POS Layar Sentuh Tablet/HP (Khusus Pemilik Warung)</p>
        <button class="btn-primary" style="background: linear-gradient(135deg, var(--success) 0%, #059669 100%); pointer-events: none;">Buka Kasir Warung ➔</button>
      </a>

    </div>

    <footer style="margin-top: 48px; font-size: 12px; color: #94a3b8;">
      KaiSer System &copy; 2026 — Built with 💙 by Ilyas
    </footer>
  </div>

</body>
</html>
